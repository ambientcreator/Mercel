name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The frontend has no build step and no test runner, so a syntax check is the
      # only automated guard it has. Every script in dist is parsed, because they are
      # loaded as five separate <script> tags rather than bundled.
      - name: Check frontend syntax
        run: |
          for file in frontend/dist/assets/*.js; do
            echo "checking $file"
            node --check "$file"
          done

  # go vet on Linux already compiles main.go and catches most breakage, so the real
  # desktop builds run on pull requests rather than on every branch push — the signal
  # that matters is "this merges without breaking a target platform".
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: windows/amd64
          - name: macos
            os: macos-latest
            platform: darwin/universal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean
